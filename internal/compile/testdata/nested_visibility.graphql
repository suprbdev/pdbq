mutation {
  createComment(input: {comment: {body: "First!", postByPostId: {create: {title: "Hello", userByAuthorId: {create: {email: "new@example.com"}}}}}}) {
    comment {
      body
      postByPostId {
        title
        userByAuthorId { email postsByAuthorId { totalCount nodes { title } } }
        commentsByPostId(filter: {parentId: {isNull: true}}) { totalCount nodes { body } }
      }
    }
  }
  createUser(input: {user: {email: "kids@example.com", postsByAuthorId: {create: [{title: "One", commentsByPostId: {create: [{body: "a"}, {body: "b"}]}}, {title: "Two"}]}}}) {
    user {
      email
      postsByAuthorId(filter: {commentsByPostId: {some: {parentId: {isNull: true}}}}) {
        totalCount
        nodes { title userByAuthorId { email } commentsByPostId { totalCount nodes { body } } }
      }
    }
  }
  createPost(input: {post: {title: "Connected", userByAuthorId: {connectById: {id: 1}}, commentsByPostId: {create: [{body: "c"}]}}}) {
    post { title userByAuthorId { email postsByAuthorId { totalCount } } commentsByPostId { nodes { body } } }
  }
  withPayloadFields: createComment(input: {comment: {body: "Hi", postByPostId: {create: {title: "Fresh", userByAuthorId: {connectById: {id: 1}}}}}}) {
    postByPostId { title }
    query { allPosts(filter: {title: {equalTo: "Fresh"}}) { totalCount } allComments { totalCount } }
  }
}
