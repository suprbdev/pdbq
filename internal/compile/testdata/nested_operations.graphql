# variables: {"c": "WyJDb21tZW50IiwyXQ=="}
mutation($c: ID!) {
  updatePostById(input: {id: 1, postPatch: {title: "T", userByAuthorId: {connectByEmail: {email: "ada@example.com"}}, commentsByPostId: {updateByNodeId: [{nodeId: $c, commentPatch: {body: "edited"}}], deleteById: [{id: 3}]}}}) {
    post { title userByAuthorId { email } commentsByPostId { totalCount nodes { body } } }
  }
  updateCommentById(input: {id: 5, commentPatch: {commentByParentId: {disconnectById: {id: 4}}, commentsByParentId: {connectById: [{id: 6}], disconnectById: [{id: 7}]}}}) {
    comment { parentId commentsByParentId { nodes { id } } }
  }
  updateUserById(input: {id: 1, userPatch: {placesByOwnerId: {create: [{name: "Home"}]}}}) {
    user { placesByOwnerId { totalCount } }
  }
  updatePlaceById(input: {id: 1, placePatch: {userByOwnerId: {updateById: {id: 2, userPatch: {fullName: "G"}}, deleteByEmail: {email: "x@example.com"}}}}) {
    place { userByOwnerId { fullName } }
  }
}
