mutation($c: ID!) {
  updatePostById(id: 1, patch: {title: "T", author: {connectByEmail: {email: "ada@example.com"}}, commentsByPostId: {updateByNodeId: [{nodeId: $c, commentPatch: {body: "edited"}}], deleteById: [{id: 3}]}}) {
    post { title author { email } commentsByPostId { totalCount nodes { body } } }
  }
  updateCommentById(id: 5, patch: {parent: {disconnectById: {id: 4}}, commentsByParentId: {connectById: [{id: 6}], disconnectById: [{id: 7}]}}) {
    comment { parentId commentsByParentId { nodes { id } } }
  }
  updateUserById(id: 1, patch: {placesByOwnerId: {create: [{name: "Home"}]}}) {
    user { placesByOwnerId { totalCount } }
  }
  createPost(input: {title: "x", author: {updateById: {id: 2, userPatch: {fullName: "G"}}}}) {
    post { author { fullName } }
  }
}
