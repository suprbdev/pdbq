# Operands bound for a column with a typmod SRID (places.location is
# geometry(Point, 4326)): bare WKT is tagged with it, EWKT in the same SRID
# keeps its tag, and GeoJSON in another CRS is reprojected to it. A bounding
# box without srid uses the column's.
{
  wkt: allPlaces(filter: {location: {intersects: "POINT(1 2)"}}) { nodes { id } }
  ewkt: allPlaces(filter: {location: {intersects: "SRID=4326;POINT(1 2)"}}) { nodes { id } }
  geojson: allPlaces(filter: {location: {intersects: {type: "Point", coordinates: [111319, 222684], crs: {type: "name", properties: {name: "EPSG:3857"}}}}}) { nodes { id } }
  bbox: allPlaces(filter: {location: {bboxIntersects: {minX: 0, minY: 0, maxX: 1, maxY: 1}}}) { nodes { id } }
  near: allPlaces(orderBy: LOCATION_DISTANCE_ASC, near: {location: "POINT(0 0)", area: "POINT(0 0)"}) { nodes { id } }
}
