# <field>Distance selects ST_Distance from the column's geometry in the
# list's near: argument: SRID units on geometry, metres on geography (the
# reference is cast to the column's flavour) and on geometry with
# useSpheroid. A list taking near: without it is an error; on rows not read
# through such a list the field is null.
{
  nearest: allPlaces(near: {location: "SRID=4326;POINT(-0.12 51.5)", area: "SRID=4326;POINT(-0.12 51.5)"}, orderBy: [LOCATION_DISTANCE_ASC], first: 3) {
    nodes {
      id
      locationDistance
      metres: locationDistance(useSpheroid: true)
      areaDistance
    }
  }
  unordered: allPlaces(near: {location: {type: "Point", coordinates: [-0.12, 51.5]}, area: {type: "Point", coordinates: [-0.12, 51.5]}}) {
    nodes { locationDistance }
  }
  noNear: allPlaces(first: 1) {
    nodes { locationDistance }
  }
  edges: allPlaces(near: {location: "POINT(-0.12 51.5)", area: "POINT(-0.12 51.5)"}, first: 2) {
    edges { node { locationDistance } }
  }
  nested: userById(id: 1) {
    placesByOwnerId(near: {location: "POINT(0 0)", area: "POINT(0 0)"}, orderBy: [AREA_DISTANCE_ASC], first: 2) {
      nodes { name areaDistance }
    }
  }
  single: placeById(id: 1) {
    locationDistance
  }
}
