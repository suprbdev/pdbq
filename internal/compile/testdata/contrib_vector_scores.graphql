# pgvector distance fields against the list's near: reference, the
# bit distances (Hamming, Jaccard) of a bit column against a bit string,
# and the distance-threshold filters, which take their own reference.
{
  scored: allEmbeddings(
    near: {embedding: [1, 0.5, -2], sparse: "{1:1}/3", code: "101"}
    orderBy: [EMBEDDING_COSINE_DISTANCE_ASC]
    first: 3
  ) {
    nodes {
      id
      embeddingCosineDistance
      embeddingL2Distance
      embeddingNegativeInnerProduct
      sparseL1Distance
      codeHammingDistance
      codeJaccardDistance
    }
  }
  missingRef: allEmbeddings(near: {embedding: [1, 0.5, -2]}, first: 1) {
    nodes { halfL2Distance }
  }
  bits: allEmbeddings(near: {code: "110"}, orderBy: [CODE_HAMMING_DISTANCE_ASC], first: 2) {
    nodes { id codeHammingDistance }
  }
  within: allEmbeddings(
    filter: {
      embedding: {cosineDistanceLessThan: {vector: [1, 0.5, -2], distance: 0.25}}
      sparse: {l2DistanceLessThan: {vector: "{1:1}/3", distance: 2}}
      code: {hammingDistanceLessThan: {vector: "101", distance: 2}}
    }
    near: {embedding: [1, 0.5, -2]}
    orderBy: [EMBEDDING_COSINE_DISTANCE_ASC]
    first: 10
  ) {
    nodes { id embeddingCosineDistance }
  }
}
