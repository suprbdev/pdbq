mutation {
  createManyUsers(input: {clientMutationId: "cm-many", users: [
    {email: "a@b.c", fullName: "Ada", mood: HAPPY}
    {email: "b@c.d"}
  ]}) {
    users { id email }
    affectedCount
    clientMutationId
  }
  updateManyUsers(input: {clientMutationId: "cm-upd", filter: {mood: {equalTo: SAD}}, userPatch: {mood: OK}}) {
    users { id mood }
    affectedCount
    clientMutationId
  }
  deleteManyUsers(input: {clientMutationId: "cm-del", filter: {email: {endsWith: "@spam.example"}}}) {
    affectedCount
    clientMutationId
  }
}
