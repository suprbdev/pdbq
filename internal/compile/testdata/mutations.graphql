mutation {
  createUser(input: {clientMutationId: "cm-1", user: {email: "a@b.c", fullName: "Ada", mood: HAPPY}}) {
    user { nodeId id email mood }
    clientMutationId
  }
  updateUserById(input: {clientMutationId: "cm-2", id: 1, userPatch: {fullName: "Grace"}}) {
    user { id fullName }
    clientMutationId
  }
  deleteUserById(input: {clientMutationId: "cm-3", id: 2}) {
    user { id }
    deletedUserNodeId
    clientMutationId
  }
}
