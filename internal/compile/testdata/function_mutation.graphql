mutation {
  addNumbers(input: {a: 2, b: 40, clientMutationId: "cm-1"}) {
    __typename
    integer
    clientMutationId
  }
  publishPost(input: {postId: 7}) {
    post {
      title
      userByAuthorId {
        email
      }
    }
    userByAuthorId {
      email
    }
    postEdge(orderBy: [TITLE_ASC]) {
      __typename
      cursor
      node {
        id
      }
    }
    query {
      __typename
      postById(id: 7) {
        published
      }
    }
  }
  unpublishPost(input: {postId: 7, clientMutationId: "cm-2"}) {
    clientMutationId
    userByAuthorId {
      id
    }
  }
  retryProbe(input: {}) {
    clientMutationId
  }
  publishPosts(input: {postIds: [1, 2]}) {
    posts {
      id
      userByAuthorId {
        email
      }
    }
    query {
      allPosts(first: 1) {
        totalCount
      }
    }
  }
  touchPost(input: {postId: 1}) {
    query {
      userById(id: 1) {
        email
      }
    }
  }
  bumpBalance(input: {userId: 1}) {
    newBalance
  }
  postTitleList(input: {postIds: [1]}) {
    strings
  }
}
