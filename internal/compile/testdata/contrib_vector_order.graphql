# pgvector distance ordering against the nearVector: reference vector, one
# per column: _ASC is nearest first (index-assisted), the operand is cast to
# the column's own type in the extension's schema. sparsevec references are
# its text form.
{
  l2: allEmbeddings(nearVector: {embedding: [1, 0.5, -2]}, orderBy: [EMBEDDING_L2_DISTANCE_ASC], first: 3) {
    nodes { id }
  }
  metrics: allEmbeddings(
    nearVector: {embedding: [1, 2, 3], half: [0.25, 0.5, 1], sparse: "{1:1,3:2}/3"}
    orderBy: [EMBEDDING_NEGATIVE_INNER_PRODUCT_ASC, EMBEDDING_COSINE_DISTANCE_DESC, EMBEDDING_L1_DISTANCE_ASC, HALF_L2_DISTANCE_ASC, SPARSE_COSINE_DISTANCE_ASC]
  ) {
    nodes { id }
  }
  missing: allEmbeddings(nearVector: {half: [1, 2, 3]}, orderBy: [EMBEDDING_L2_DISTANCE_ASC]) {
    nodes { id }
  }
  empty: allEmbeddings(nearVector: {embedding: []}, orderBy: [EMBEDDING_L2_DISTANCE_ASC]) {
    nodes { id }
  }
  nullFilter: allEmbeddings(filter: {embedding: {isNull: false}, sparse: {isNull: true}}) {
    nodes { id }
  }
}
