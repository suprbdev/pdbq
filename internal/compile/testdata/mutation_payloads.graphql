# PostGraphile payload fields on table mutations: query, the row's forward
# relations and its edge, all read in the mutation's own statement.
mutation {
  createPost(input: {clientMutationId: "cm-1", post: {authorId: 1, title: "Hi"}}) {
    clientMutationId
    userByAuthorId {
      email
    }
    postEdge {
      cursor
      node {
        title
      }
    }
    query {
      allPosts(first: 10) {
        totalCount
        nodes {
          title
        }
      }
      userById(id: 1) {
        email
      }
    }
  }
  deletePostById(input: {id: 3}) {
    post {
      id
    }
    query {
      postById(id: 3) {
        id
      }
    }
  }
  updateManyPosts(input: {filter: {authorId: {equalTo: 1}}, postPatch: {published: true}}) {
    affectedCount
    query {
      allPosts(first: 10, filter: {authorId: {equalTo: 1}}) {
        totalCount
      }
    }
  }
}
