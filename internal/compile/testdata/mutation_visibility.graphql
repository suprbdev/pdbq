mutation {
  createPost(input: {post: {authorId: 1, title: "New"}}) {
    post {
      title
      userByAuthorId { postsByAuthorId(filter: {title: {startsWith: "N"}}) { totalCount nodes { title } } }
    }
  }
  createComment(input: {comment: {postId: 1, parentId: 3, body: "Reply"}}) {
    comment { body commentByParentId { body commentsByParentId { totalCount } } }
  }
  updatePostById(input: {id: 1, postPatch: {title: "Renamed"}}) {
    post { id userByAuthorId { postsByAuthorId(orderBy: TITLE_ASC) { nodes { id title } } } }
  }
  updateUserByEmail(input: {email: "a@b.c", userPatch: {email: "z@b.c"}}) {
    user { email postsByAuthorId { nodes { userByAuthorId { email } } } }
  }
  upsertUserByEmail(input: {user: {email: "a@b.c", fullName: "Ada"}}) {
    user { email postsByAuthorId { nodes { userByAuthorId { fullName } } } }
  }
  deletePostById(input: {id: 1}) {
    post { title userByAuthorId { postsByAuthorId { totalCount } } }
  }
  createManyPosts(input: {posts: [{authorId: 1, title: "A"}, {authorId: 1, title: "B"}]}) {
    posts { userByAuthorId { postsByAuthorId { totalCount } } }
  }
  updateManyPosts(input: {filter: {authorId: {equalTo: 1}}, postPatch: {published: true}}) {
    posts { userByAuthorId { postsByAuthorId(filter: {title: {startsWith: "P"}}) { totalCount } } }
  }
  deleteManyPosts(input: {filter: {title: {startsWith: "Draft"}}}) {
    posts { userByAuthorId { postsByAuthorId { totalCount } } }
    affectedCount
  }
  updateCommentById(input: {id: 1, commentPatch: {body: "Edited"}}) {
    comment { postByPostId { title } }
  }
}
