mutation {
  createBookingNote(input: {bookingNote: {validAt: {start: {value: "2026-03-02", inclusive: true}, end: {value: "2026-03-04", inclusive: false}}, note: "Late arrival", authorId: 1, roomBookingsByRoomIdAndValidAt: {connectByRoomId: {roomId: 1}}}}) {
    bookingNote { id roomBookingsByRoomIdAndValidAt { nodes { guest } } }
  }
  createRoomBooking(input: {roomBooking: {roomId: 3, validAt: {start: {value: "2026-05-01", inclusive: true}, end: {value: "2026-05-10", inclusive: false}}, guest: "Ada", bookingNotesByRoomIdAndValidAt: {create: [{validAt: {start: {value: "2026-05-02", inclusive: true}, end: {value: "2026-05-03", inclusive: false}}, note: "Early", authorId: 1}]}}}) {
    roomBooking { guest bookingNotesByRoomIdAndValidAt { nodes { note } } }
  }
  updateRoomBookingByRoomIdAndValidAt(input: {roomId: 1, validAt: {start: {value: "2026-03-01", inclusive: true}, end: {value: "2026-03-05", inclusive: false}}, roomBookingPatch: {guest: "Grace"}}) {
    roomBooking { guest }
  }
}
