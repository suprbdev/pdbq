# Fields sharing a response key merge into one key holding both selections,
# whether they repeat directly or arrive through fragments: forward and
# backward relations, connection internals and composite columns alike.
{
  postById(id: 1) {
    userByAuthorId { email }
    ... on Post { userByAuthorId { id } }
    ...authorName
  }
  userById(id: 1) {
    address { city }
    address { street }
    postsByAuthorId { nodes { id } }
    postsByAuthorId { totalCount nodes { title } }
  }
}

fragment authorName on Post {
  userByAuthorId { fullName }
}
