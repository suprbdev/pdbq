# Vector inputs bind through pgvector's codec: one text parameter in the
# type's text form, cast to the column's type in the extension's schema.
# vector and halfvec take lists of numbers, sparsevec its text form.
mutation {
  createEmbedding(input: {embedding: {embedding: [1, 2.5, -3], half: [0.5, 1, 2], sparse: "{1:1,3:2}/3"}}) {
    embedding { id embedding half sparse }
  }
  updateEmbeddingById(input: {id: 1, embeddingPatch: {embedding: [0, 0, 1], sparse: null}}) {
    embedding { embedding }
  }
  createManyEmbeddings(input: {embeddings: [{embedding: [1, 1, 1]}, {half: [2, 2, 2]}]}) {
    affectedCount
  }
}
