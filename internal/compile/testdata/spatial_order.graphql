# Distance ordering uses the KNN operator (<->) so a GiST index can answer it
# directly. Without the column's geometry in near: the value is an error.
{
  nearest: allPlaces(near: {location: {type: "Point", coordinates: [-0.12, 51.5]}, area: {type: "Point", coordinates: [-0.12, 51.5]}}, orderBy: [LOCATION_DISTANCE_ASC], first: 3) {
    nodes { id name }
  }
  farthest: allPlaces(near: {location: "SRID=4326;POINT(-0.12 51.5)", area: "SRID=4326;POINT(-0.12 51.5)"}, orderBy: [LOCATION_DISTANCE_DESC]) {
    nodes { id }
  }
  missingNear: allPlaces(orderBy: [LOCATION_DISTANCE_ASC]) {
    nodes { id }
  }
}
