# Distance ordering uses the KNN operator (<->) so a GiST index can answer it
# directly. Without a near: argument the distance term is dropped, leaving the
# primary-key tiebreaker.
{
  nearest: allPlaces(near: {geometry: {type: "Point", coordinates: [-0.12, 51.5]}}, orderBy: [LOCATION_DISTANCE_ASC], first: 3) {
    nodes { id name }
  }
  farthest: allPlaces(near: {geometry: "SRID=4326;POINT(-0.12 51.5)"}, orderBy: [LOCATION_DISTANCE_DESC]) {
    nodes { id }
  }
  missingNear: allPlaces(orderBy: [LOCATION_DISTANCE_ASC]) {
    nodes { id }
  }
}
