# variables: {"after": "WyJEb2N1bWVudCIsIDNd"}
# Ordering by ltree depth, by the value of the near: key and by
# Levenshtein distance to the near: text, with the distance as a
# field; keyset pages recompute the anchor row's values.
query ($after: Cursor) {
  depth: allDocuments(orderBy: [PATH_NLEVEL_DESC], first: 3) { nodes { id pathNlevel } }
  byValue: allDocuments(near: {attrs: "color"}, orderBy: [ATTRS_VALUE_ASC], after: $after, first: 2) {
    nodes { id attrsValue(key: "color") }
  }
  nearest: allDocuments(near: {notes: "kitten"}, orderBy: [NOTES_LEVENSHTEIN_DISTANCE_ASC], after: $after, first: 2) {
    nodes { id notesLevenshteinDistance }
  }
  noKey: allDocuments(orderBy: [ATTRS_VALUE_DESC]) { nodes { id } }
  noScoreRef: allDocuments(first: 1) { nodes { notesLevenshteinDistance } }
}
