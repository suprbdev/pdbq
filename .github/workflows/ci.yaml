name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
      - name: Unit + golden tests (race)
        run: go test -race ./...
      - name: Benchmarks compile
        run: go test -bench=. -benchtime=1x -run=^$ ./internal/compile/

  e2e:
    name: e2e (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(github.event_name == 'pull_request' && '[14, 19]' || '[14, 15, 16, 17, 18, 19]') }}
    services:
      postgres:
        # PostGIS-enabled: the fixture schema creates the extension for the
        # spatial e2e coverage.
        image: postgis/postgis:${{ matrix.pg }}-3.7
        env:
          POSTGRES_USER: pdbq
          POSTGRES_PASSWORD: pdbq
          POSTGRES_DB: pdbq_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pdbq"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Load fixture schema
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client; }
          PGPASSWORD=pdbq psql -h localhost -p 5433 -U pdbq -d pdbq_test -f db/init/01-schema.sql
      - name: E2E tests
        env:
          PDBQ_TEST_DATABASE_URL: postgres://pdbq:pdbq@localhost:5433/pdbq_test
        run: go test -race -count=1 ./test/

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build .
