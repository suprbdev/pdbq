name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Unit + golden tests (race)
        run: go test -race ./...
      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${platform%/*} arch=${platform#*/}
            bin=pdbq; [ "$os" = windows ] && bin=pdbq.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/$bin" ./cmd/pdbq
            name="pdbq_${VERSION#v}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd dist && zip -q "$name.zip" "$bin")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$bin"
            fi
            rm "dist/$bin"
          done
      - name: SBOM (CycloneDX)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          cyclonedx-gomod app -json -licenses -main cmd/pdbq \
            -output "dist/pdbq_${VERSION#v}_sbom.cdx.json" .
      - name: Checksums
        run: cd dist && sha256sum -- * > checksums.txt
      - uses: sigstore/cosign-installer@v3
        if: ${{ !env.ACT }}
      - name: Sign checksums (cosign, keyless)
        if: ${{ !env.ACT }}
        run: |
          cosign sign-blob --yes \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt
      - name: Attest build provenance
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt
      - name: Create GitHub release
        # Skipped under act (local workflow testing); act sets ACT=true.
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ !env.ACT }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v3
        if: ${{ !env.ACT }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
        if: ${{ !env.ACT }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            suprbdev/pdbq
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !env.ACT }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Sign the image (cosign, keyless)
        if: ${{ !env.ACT }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}@${DIGEST}"
          cosign sign --yes "suprbdev/pdbq@${DIGEST}"
      - name: Attest image provenance
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
