# pdbq reference configuration.
# Generated by `pdbq config example` from the config structs — reference, not for direct use.
# Every key is also settable via env (PDBQ_SECTION_KEY, double underscore for '_' in names)
# or command-line flags; precedence is flags > env > file.

database:
  # PostgreSQL connection URL, e.g. postgres://user:pass@host:5432/db. Also honours standard PG* env vars when empty.
  url: ""
  # Maximum pooled connections.
  max_conns: 10
  # Timeout for establishing a connection.
  connect_timeout: "10s"
  # Per-statement timeout applied to every request (0 disables).
  statement_timeout: "30s"

server:
  # Listen address for the HTTP server.
  addr: ":8080"
  # Serve the GraphiQL playground at / (off by default; enable for development).
  graphiql: false
  # Serve the generated SDL at /schema.graphql (off by default; it reveals every table, column and relation to unauthenticated callers).
  expose_schema: false
  # Overall HTTP request timeout.
  request_timeout: "30s"
  # Timeout of the database ping behind GET /readyz; an unreachable or slow database answers 503. /healthz stays a liveness check.
  readyz_timeout: "2s"
  # Maximum accepted request body size in bytes.
  max_body_bytes: 1048576
  # Maximum GraphQL selection depth per operation.
  max_depth: 15
  # Maximum estimated cost (selected fields x list multipliers) per operation.
  max_cost: 10000
  # Maximum rows per page; first/last above this are rejected and it is the default page size when neither is given.
  max_page_size: 100
  # Maximum lexical tokens (names, punctuation, values, comments) in a GraphQL document; parsing stops at the first token beyond it. Bounds the parse and validation work of one request.
  max_query_tokens: 15000
  # Maximum nesting of input values (list and input object literals, and variable values of list and input object types), e.g. filter not/and/or chains.
  max_input_depth: 32
  # Maximum selections (fields, fragment spreads, inline fragments) in a GraphQL document with every fragment spread expanded; rejects fragment bombs before they are walked.
  max_selections: 10000
  # Maximum estimated JSON size in bytes of the __schema / __type fields of one operation; aliases multiply every type and field they select, so larger introspection responses are rejected while they are built.
  max_introspection_bytes: 16777216
  # Maximum field pairs validation compares to check that fields sharing a response key at one position (fragments expanded) can be merged; that check is quadratic in such repeated fields.
  max_field_comparisons: 100000
  # Number of parsed and validated GraphQL documents cached by query text (least recently used evicted first, within document_cache_bytes). 0 disables the cache.
  document_cache_size: 1000
  # Estimated memory the document cache may retain (query text plus parsed and validated AST); least recently used documents are evicted beyond it.
  document_cache_bytes: 67108864
  # Estimated size above which a parsed document is not cached (large documents gain little from caching).
  document_cache_max_entry_bytes: 1048576
  # Allowed CORS origins for /graphql (exact match, or '*' for any). Empty disables CORS headers entirely.
  cors_origins: []
  # Gzip responses for clients that send Accept-Encoding: gzip (off by default).
  compression: false
  # Enable Apollo automatic persisted queries: clients send a sha256 hash in the persistedQuery extension and register the document once on a miss (in-memory cache).
  apq: false
  # JSON file mapping sha256 hex hashes to GraphQL documents, preloaded as persisted queries (never evicted).
  persisted_queries_path: ""
  # Reject requests that do not reference a persisted query via the persistedQuery extension (requires apq or persisted_queries_path).
  persisted_only: false
  # Reject every mutation operation (read-only mode) for maintenance, demos or defense in depth. Also toggleable at runtime when embedding pdbq as a library (App.SetReadOnly).
  read_only: false
  # Reject __schema / __type introspection queries and leave the "Did you mean" suggestions out of validation errors (off by default). Enable in production to hide the schema shape; __typename keeps working.
  disable_introspection: false
  # Serve the defer and stream directives of GraphQL incremental delivery: the schema declares them, a query using them is answered over HTTP as multipart/mixed (Accept: multipart/mixed) and over WebSocket as several next messages, every payload read from one repeatable read snapshot. Off by default; while off the schema declares neither directive, stream is rejected and defer is ignored (one result).
  incremental_delivery: false
  # Maximum deferred fragments and streamed fields in one operation; each one runs its own statements.
  incremental_max_deferred: 16
  # Items per payload of a streamed list after its initialCount items; each batch is one statement.
  incremental_stream_batch_size: 10
  # Longest one payload of an incremental HTTP response may take to reach a client that stopped reading; the response is then aborted and its transaction rolled back, releasing the pooled connection. request_timeout still bounds the whole response.
  incremental_write_timeout: "10s"
  # Incremental responses (HTTP and WebSocket) holding a transaction at once, over every contract; a request beyond it is answered by one result, with the defer and stream directives ignored. 0 means half of database.max_conns (at least 1).
  incremental_max_responses: 0
  # Serve PostGraphile-style simple subscriptions (Subscription.listen over LISTEN/NOTIFY) on /graphql over WebSocket, graphql-transport-ws or the legacy graphql-ws subprotocol. Off by default; while off the schema has no Subscription type.
  subscriptions: false
  # Maximum operations running at once on one WebSocket connection, counted until each has fully stopped; a subscribe beyond it gets an error (or waits while completed operations are still stopping).
  subscriptions_max_per_connection: 100
  # Maximum WebSocket connections at once; further upgrade requests are answered 503.
  subscriptions_max_connections: 1000
  # Maximum operations running at once over all WebSocket connections; a subscribe beyond it gets an error.
  subscriptions_max_operations: 10000
  # Subscribe messages accepted per second on one WebSocket connection, with bursts up to subscriptions_max_per_connection; faster clients are slowed down (their messages are read later). 0 disables the limit.
  subscriptions_subscribe_rate: 100
  # Prefix put before the listen topic to form the PostgreSQL channel, as in pg_notify('postgraphile:' || topic, payload). The channel must fit in 63 bytes.
  subscriptions_topic_prefix: "postgraphile:"
  # Topics clients may listen to, without the prefix; an entry ending in * allows every topic starting with the rest. Empty allows any topic of letters, digits and _ . : / - characters.
  subscriptions_topics: []
  # Interval of the WebSocket ping (and legacy graphql-ws ka message) on subscription connections; a peer that does not answer within it is disconnected. 0 disables.
  subscriptions_keepalive: "15s"
  # Notifications queued per subscription while its events are being resolved; a subscriber that falls further behind gets an error and its subscription ends.
  subscriptions_buffer: 32
  # Serve live queries (requires subscriptions): every Query field is repeated on the Subscription root, and a query operation marked with the live directive is live too; the result is re-sent whenever a table it read changes, re-run under the subscriber's identity. Change detection uses per-table triggers notifying live_channel. Off by default; while off the schema is unchanged.
  live: false
  # LISTEN channel the change triggers notify with the changed table's OID; it also names the triggers (<channel>, <channel>_truncate) and their function (<channel>_notify). Letters, digits and underscores.
  live_channel: "pdbq_live"
  # Install the change triggers at startup (and after watch-mode rebuilds) on the tables of the exposed schemas and the tables their views read; needs table ownership. Disable to install them yourself (see docs/live.md).
  live_install_triggers: true
  # Shortest time between two runs of one live query; changes in between are coalesced into one run at the end of the interval.
  live_throttle: "500ms"
  # Live query runs in flight at once across the server; further runs wait, so a burst of changes cannot take every pool connection.
  live_concurrency: 4
  # Maximum live queries running at once on one WebSocket connection (they also count against subscriptions_max_per_connection).
  live_max_per_connection: 10
  # Maximum live queries running at once over all WebSocket connections (they also count against subscriptions_max_operations).
  live_max_operations: 1000

schema:
  # PostgreSQL schemas to expose.
  schemas: ["public"]
  # Boot from this schema cache file instead of introspecting (see pdbq schema dump).
  cache_path: ""
  # Expose PostgreSQL functions as custom queries/mutations.
  functions: true
  # Expose the partitions of partitioned tables as tables of their own. Off by default: their rows are reachable through the partitioned parent.
  expose_partitions: false
  # Expose each domain over a built-in scalar type as a custom scalar named after it (PostGraphile's behaviour), described by its comment and constraints. Disable to type domain columns and arguments as their base type.
  domain_scalars: true

filters:
  # Only allow filtering on columns covered by an index (default policy).
  indexed_only: true
  # Per-table extra filterable columns, keyed by schema.table, overriding indexed_only.
  allow_columns: {}

rls:
  # Run each request as a switched role with claims exposed via set_config (SET LOCAL). Disabling uses the privileged connection directly and logs a loud warning.
  enabled: true
  # Role assumed for authenticated requests without a role claim.
  default_role: ""
  # Role assumed for unauthenticated requests.
  anonymous_role: "anonymous"
  # JWT claim (or claim header in headers mode: app_role is <header_prefix>App-Role) carrying the database role.
  role_claim: "role"
  # Roles a request may assume via the role claim. Empty allows any role (subject to database grants); default_role and anonymous_role are always allowed.
  allowed_roles: []
  # set_config namespace for request claims, e.g. pdbq.claims.
  claims_prefix: "pdbq.claims"
  auth:
    # Claim source: 'jwt', 'headers' (behind a trusted gateway), or 'none'.
    mode: "jwt"
    # HMAC secret for HS256/384/512 verification (jwt mode; ignored when jwks_url is set).
    jwt_secret: ""
    # JWKS endpoint for asymmetric JWT verification (RS256/384/512, ES256/384/512). Takes precedence over jwt_secret.
    jwks_url: ""
    # How long fetched JWKS keys are cached; an unknown kid triggers an early refresh (key rotation) at most once a minute. After the TTL, keys refresh in the background and stay in use for up to one more TTL while the endpoint fails; failed fetches back off from 1s to 1m.
    jwks_cache_ttl: "1h0m0s"
    # Expected iss claim; empty skips the check.
    jwt_issuer: ""
    # Expected aud claim; empty skips the check.
    jwt_audience: ""
    # Header prefix mapped to claims in headers mode, e.g. X-Pdbq-Claim-. The rest of the name maps to one claim (User-Id is user_id); requests with a claim header containing an underscore or other punctuation, repeated, or folding onto another claim header are rejected. The gateway must strip every client-supplied header with this prefix, in any letter case.
    header_prefix: "X-Pdbq-Claim-"
    # Claim names (e.g. user_id) accepted from claim headers in headers mode; role_claim is always accepted. Requests carrying any other claim header are rejected. Empty accepts any claim.
    header_claims: []
    # CIDR blocks (or single IPs) allowed to supply claim headers in headers mode. Requests from other peers that carry claim headers are rejected. Empty trusts every peer and logs a startup warning.
    trusted_proxies: []
    # Schema-qualified composite type (e.g. public.jwt) minted into a signed JWT: any function returning it yields an HS256 token string built from the composite's fields (an exp field becomes the token expiry). Requires jwt_secret; jwt_issuer/jwt_audience are embedded when set. Empty disables minting.
    jwt_type: ""

transactions:
  # Wrap every mutation in a transaction.
  mutations: true
  # Use one transaction for the whole request instead of one per operation.
  per_request: false
  # Transaction isolation level: read_committed, repeatable_read, serializable.
  isolation: "read_committed"
  # Automatic retries of a transactional operation after a serialization failure or deadlock (SQLSTATE 40001/40P01). 0 disables; the whole operation re-runs, which is safe because the failed attempt rolled back.
  max_retries: 0
  # Let a request opt in (extensions.partialMutations) to running each mutation root field in its own savepoint, so a failing field is reported without rolling back the others. Requests asking for it while this is off are rejected.
  partial_mutations: false

watch:
  # Re-introspect and hot-swap the schema on DDL changes (dev only; refuses to combine with schema.cache_path).
  enabled: false
  # Poll interval used when event triggers cannot be installed.
  poll_interval: "5s"
  # NOTIFY channel used by the DDL event trigger.
  channel: "pdbq_ddl"

errors:
  # 'dev' exposes full PostgreSQL error detail in GraphQL errors; 'prod' sanitizes but passes constraint-violation and bad-input messages through; 'strict' hides every database error message (constraint and column names never leak).
  detail: "prod"

plugins:
  # Plugin names to disable.
  disabled: []
  # Per-plugin configuration, keyed by plugin name.
  settings: {}

log:
  # Log level: debug, info, warn, error.
  level: "info"
  # Log format: text or json.
  format: "text"

metrics:
  # Serve Prometheus metrics (HTTP requests, database operations, pool statistics, schema rebuilds).
  enabled: false
  # URL path of the metrics endpoint.
  path: "/metrics"
  # Separate listen address for the metrics endpoint, e.g. :9090, keeping it off the public listener; empty serves it on the main server address.
  addr: ""

# Schema contracts: named GraphQL schemas for different audiences, each a subset of the full schema selected by @contract / @behavior ±contract:<name> smart comments and served at <path>/graphql. Entries are {name, default: include|exclude, path (default /<name>)}, or bare names. When set, only the contracts are served (give one path: / to serve it at /graphql). Requires the smart-comments plugin.
contracts: []
