# pdbq reference configuration.
# Generated by `pdbq config example` from the config structs — reference, not for direct use.
# Every key is also settable via env (PDBQ_SECTION_KEY, double underscore for '_' in names)
# or command-line flags; precedence is flags > env > file.

database:
  # PostgreSQL connection URL, e.g. postgres://user:pass@host:5432/db. Also honours standard PG* env vars when empty.
  url: ""
  # Maximum pooled connections.
  max_conns: 10
  # Timeout for establishing a connection.
  connect_timeout: "10s"
  # Per-statement timeout applied to every request (0 disables). Keep it below the HTTP request timeout so a slow statement fails with SQLSTATE 57014 (a timeout error the client can act on) before the request is cut off.
  statement_timeout: "25s"

server:
  # Listen address for the HTTP server.
  addr: ":8080"
  # Serve the GraphiQL playground at / (off by default; enable for development).
  graphiql: false
  # Answer __schema / __type introspection queries, serve the generated SDL at /schema.graphql and add "Did you mean" suggestions to validation errors. On by default, like pdbr's OpenAPI document; it reveals every table, column and relation to unauthenticated callers, so disable it in production to hide the schema shape (__typename keeps working).
  introspection: true
  # Overall HTTP request timeout.
  request_timeout: "30s"
  # Timeout of the database ping behind GET /readyz; an unreachable or slow database answers 503. /healthz stays a liveness check.
  readyz_timeout: "2s"
  # Allowed CORS origins for /graphql (exact match, or '*' for any). Empty disables CORS headers entirely.
  cors_origins: []
  # Gzip responses for clients that send Accept-Encoding: gzip (off by default).
  compression: false
  # Reject every mutation operation (read-only mode) for maintenance, demos or defense in depth. Also toggleable at runtime when embedding pdbq as a library (App.SetReadOnly).
  read_only: false
  # Cache of parsed and validated GraphQL documents, keyed by query text.
  document_cache:
    # Number of parsed and validated documents cached (least recently used evicted first, within bytes). 0 disables the cache.
    size: 1000
    # Estimated memory the document cache may retain (query text plus parsed and validated AST); least recently used documents are evicted beyond it.
    bytes: 67108864
    # Estimated size above which a parsed document is not cached (large documents gain little from caching).
    max_entry_bytes: 1048576

limits:
  # Maximum accepted request body size in bytes.
  max_body_bytes: 1048576
  # Maximum GraphQL selection depth per operation.
  max_depth: 15
  # Maximum estimated cost per operation: each selected field costs 1 (plus its surcharges), and a list multiplies its selections by the rows it can fetch: its first/last, else max_page_size (the page a connection or list fetches when given neither), and 10 for a list without page arguments. @costMultiplier smart comments tune the estimate.
  max_cost: 100000
  # Maximum rows per page; first/last above this are rejected and it is the default page size when neither is given.
  max_page_size: 100
  # Characters of a document a full-text headline (<field>Headline) reads: text is cut to its first max_headline_document characters, a longer json/jsonb document gets a null headline. ts_headline's work grows with the document, and the cost estimate charges each headline by this bound.
  max_headline_document: 65536
  # Maximum lexical tokens (names, punctuation, values, comments) in a GraphQL document; parsing stops at the first token beyond it. Bounds the parse and validation work of one request.
  max_query_tokens: 15000
  # Maximum nesting of input values (list and input object literals, and variable values of list and input object types), e.g. filter not/and/or chains.
  max_input_depth: 32
  # Maximum selections (fields, fragment spreads, inline fragments) in a GraphQL document with every fragment spread expanded; rejects fragment bombs before they are walked.
  max_selections: 10000
  # Maximum estimated JSON size in bytes of the __schema / __type fields of one operation; aliases multiply every type and field they select, so larger introspection responses are rejected while they are built.
  max_introspection_bytes: 16777216
  # Maximum field pairs validation compares to check that fields sharing a response key at one position (fragments expanded) can be merged; that check is quadratic in such repeated fields.
  max_field_comparisons: 100000

persisted_queries:
  # Enable Apollo automatic persisted queries: clients send a sha256 hash in the persistedQuery extension and register the document once on a miss (in-memory cache).
  apq: false
  # JSON file mapping sha256 hex hashes to GraphQL documents, preloaded as persisted queries (never evicted).
  path: ""
  # Reject requests that do not reference a persisted query via the persistedQuery extension (requires apq or path).
  only: false

subscriptions:
  # Serve PostGraphile-style simple subscriptions (Subscription.listen over LISTEN/NOTIFY) on /graphql over WebSocket, graphql-transport-ws or the legacy graphql-ws subprotocol. Off by default; while off the schema has no Subscription type.
  enabled: false
  # Maximum operations running at once on one WebSocket connection, counted until each has fully stopped; a subscribe beyond it gets an error (or waits while completed operations are still stopping).
  max_per_connection: 100
  # Maximum WebSocket connections at once; further upgrade requests are answered 503.
  max_connections: 1000
  # Maximum operations running at once over all WebSocket connections; a subscribe beyond it gets an error.
  max_operations: 10000
  # Subscribe messages accepted per second on one WebSocket connection, with bursts up to max_per_connection; faster clients are slowed down (their messages are read later).
  subscribe_rate: 100
  # Prefix put before the listen topic to form the PostgreSQL channel, as in pg_notify('postgraphile:' || topic, payload). The channel must fit in 63 bytes.
  topic_prefix: "postgraphile:"
  # Topics clients may listen to, without the prefix; an entry ending in * allows every topic starting with the rest. Empty allows any topic of letters, digits and _ . : / - characters.
  topics: []
  # Interval of the WebSocket ping (and legacy graphql-ws ka message) on subscription connections; a peer that does not answer within it is disconnected. 0 disables.
  keepalive: "15s"
  # Notifications queued per subscription while its events are being resolved; a subscriber that falls further behind gets an error and its subscription ends.
  buffer: 32

live:
  # Serve live queries (requires subscriptions.enabled): every Query field is repeated on the Subscription root, and a query operation marked with the live directive is live too; the result is re-sent whenever a table it read changes, re-run under the subscriber's identity. Change detection uses per-table triggers notifying channel. Off by default; while off the schema is unchanged.
  enabled: false
  # LISTEN channel the change triggers notify with the changed table's OID; it also names the triggers (<channel>, <channel>_truncate) and their function (<channel>_notify). Letters, digits and underscores.
  channel: "pdbq_live"
  # Install the change triggers at startup (and after watch-mode rebuilds) on the tables of the exposed schemas and the tables their views read; needs table ownership. Disable to install them yourself (see docs/live.md).
  install_triggers: true
  # Shortest time between two runs of one live query; changes in between are coalesced into one run at the end of the interval.
  throttle: "500ms"
  # Live query runs in flight at once across the server; further runs wait, so a burst of changes cannot take every pool connection.
  concurrency: 4
  # Maximum live queries running at once on one WebSocket connection (they also count against subscriptions.max_per_connection).
  max_per_connection: 10
  # Maximum live queries running at once over all WebSocket connections (they also count against subscriptions.max_operations).
  max_operations: 1000

incremental:
  # Serve the defer and stream directives of GraphQL incremental delivery: the schema declares them, a query using them is answered over HTTP as multipart/mixed (Accept: multipart/mixed) and over WebSocket as several next messages, every payload read from one repeatable read snapshot. Off by default; while off the schema declares neither directive, stream is rejected and defer is ignored (one result).
  enabled: false
  # Maximum deferred fragments and streamed fields in one operation; each one runs its own statements.
  max_deferred: 16
  # Items per payload of a streamed list after its initialCount items; each batch is one statement.
  stream_batch_size: 10
  # Longest one payload of an incremental HTTP response may take to reach a client that stopped reading; the response is then aborted and its transaction rolled back, releasing the pooled connection. server.request_timeout still bounds the whole response.
  write_timeout: "10s"
  # Incremental responses (HTTP and WebSocket) holding a transaction at once, over every contract; a request beyond it is answered by one result, with the defer and stream directives ignored. Must stay below database.max_conns so other requests still get a connection.
  max_responses: 5

schema:
  # PostgreSQL schemas to expose.
  schemas: ["public"]
  # Boot from this schema cache file instead of introspecting (see pdbq schema dump).
  cache_path: ""
  # Expose PostgreSQL functions as custom queries/mutations.
  functions: true
  # Expose the partitions of partitioned tables as tables of their own. Off by default: their rows are reachable through the partitioned parent.
  expose_partitions: false
  # Expose each domain over a built-in scalar type as a custom scalar named after it (PostGraphile's behaviour), described by its comment and constraints. Disable to type domain columns and arguments as their base type.
  domains: true

filters:
  # Only allow filtering on columns covered by an index (default policy).
  indexed_only: true
  # Per-table extra filterable columns, keyed by schema.table, overriding indexed_only.
  allow_columns: {}

# Aggregates (aggregates plugin): aggregates and groupedAggregates on connections, relation-aggregate filters and ordering, spatial aggregates.
aggregates:
  # Aggregates for every table; otherwise only for tables tagged @aggregates.
  enabled: false
  # groupedAggregates, <Type>GroupBy and <Type>HavingInput.
  grouped: true
  # <REL>_COUNT_* and <REL>_<AGGREGATE>_<COLUMN>_* orderBy values.
  order: true
  # The aggregates field of to-many relation filters.
  filters: true
  # The stExtent and stCentroid spatial aggregates.
  spatial: true
  # The stUnion and stCollect spatial aggregates, whose results grow with the row set.
  spatial_union_collect: false
  # Cost-estimate surcharge per aggregate field, aggregate orderBy value and relation-aggregate comparison.
  scan_cost: 10

auth:
  # Credential source: 'jwt' (verify a bearer JWT), 'headers' (claims set by a trusted gateway) or 'none' (no credentials: every request is anonymous).
  mode: "jwt"
  # JWT verification (jwt mode) and the key minting signs with.
  jwt:
    # HMAC secret verifying HS256/384/512 tokens (ignored for verification when jwks_url is set) and signing minted tokens.
    secret: ""
    # File holding the HMAC secret (trailing newlines are stripped), instead of secret.
    secret_file: ""
    # JWKS endpoint for asymmetric JWT verification (RS256/384/512, ES256/384/512). Takes precedence over secret.
    jwks_url: ""
    # How long fetched JWKS keys are cached; an unknown kid triggers an early refresh (key rotation) at most once a minute. After the TTL, keys refresh in the background and stay in use for up to one more TTL while the endpoint fails; failed fetches back off from 1s to 1m.
    jwks_cache_ttl: "1h0m0s"
    # Expected iss claim; empty skips the check.
    issuer: ""
    # Expected aud claim; empty skips the check.
    audience: ""
    # Clock skew tolerated when checking exp, nbf and iat.
    leeway: "0s"
    # Path of the claim carrying the database role: dot-separated keys with optional array indexes and double-quoted keys, e.g. role, app_metadata.role, realm_access.roles[0] or "https://example.com/role". A missing claim falls back to roles.default; a claim that is not a non-empty string is rejected.
    role_claim_path: "role"
  # Gateway claim headers (headers mode).
  headers:
    # Header prefix mapped to claims, e.g. X-Pdbq-Claim-. The rest of the name maps to one claim (User-Id is user_id); requests with a claim header containing an underscore or other punctuation, repeated, or folding onto another claim header are rejected. The gateway must strip every client-supplied header with this prefix, in any letter case.
    prefix: "X-Pdbq-Claim-"
    # Claim names (e.g. user_id) accepted from claim headers; role_claim is always accepted. Requests carrying any other claim header are rejected. Empty accepts any claim.
    claims: []
    # Claim carrying the database role (role is sent as <prefix>Role). A missing claim falls back to roles.default.
    role_claim: "role"
    # CIDR blocks (or single IPs) allowed to send claim headers; required in headers mode. Requests from other peers that carry claim headers are rejected.
    trusted_proxies: []
  # Schema-qualified composite type (e.g. public.jwt) minted into a signed JWT: any function returning it yields an HS256 token string built from the composite's fields (an exp field becomes the token expiry). Requires jwt.secret or jwt.secret_file; jwt.issuer/jwt.audience are embedded when set. Empty disables minting.
  mint_type: ""

roles:
  # Run each request as its resolved role (SET LOCAL ROLE). Disabling runs every request as the connection role, with credentials still verified and claims still set; it logs a loud warning.
  switch: true
  # Role of requests without credentials (every request in auth mode none). Empty refuses requests without credentials with 401 (auth modes jwt and headers).
  anonymous: ""
  # Role of authenticated requests without a role claim; empty falls back to anonymous, and a request that resolves to no role is refused.
  default: ""
  # Roles a request may assume via its role claim. Empty allows any role (subject to database grants); default and anonymous are always allowed.
  allowed: []

claims:
  # Namespace of the per-claim settings: claim user_id is current_setting('jwt.claims.user_id', true) with the default (PostGraphile's). Empty sets no per-claim settings.
  prefix: "jwt.claims"
  # Setting that receives every claim as one JSON object ('{}' without credentials), e.g. request.jwt.claims (PostgREST's: current_setting('request.jwt.claims', true)::json->>'sub'). Empty sets none.
  json_setting: ""

transactions:
  # Transaction isolation level: read_committed, repeatable_read, serializable.
  isolation: "read_committed"
  # Automatic retries of a transactional operation after a serialization failure or deadlock (SQLSTATE 40001/40P01). 0 disables; the whole operation re-runs, which is safe because the failed attempt rolled back.
  max_retries: 0
  # Use one transaction for the whole request instead of one per operation.
  per_request: false
  # Partial success: a request opts in (extensions.partialMutations) to running each mutation root field in its own savepoint, so a failing field is reported without rolling back the others.
  partial:
    # Accept the extensions.partialMutations opt-in. Requests asking for it while this is off are rejected.
    enabled: false
    # Most mutation root fields an operation running with partialMutations may have; each one is its own statement and savepoint, so this bounds the round trips one request makes. Larger operations are rejected.
    max_items: 1000

watch:
  # Re-introspect and hot-swap the schema on DDL changes (dev only; refuses to combine with schema.cache_path).
  enabled: false
  # Poll interval used when event triggers cannot be installed.
  poll_interval: "5s"
  # NOTIFY channel used by the DDL event trigger.
  channel: "pdbq_ddl"

errors:
  # 'dev' exposes full PostgreSQL error detail in GraphQL errors; 'prod' sanitizes but passes constraint-violation and bad-input messages through; 'strict' hides every database error message (constraint and column names never leak).
  detail: "prod"

plugins:
  # Plugin names to disable.
  disabled: []
  # Per-plugin settings, one section per plugin.
  settings:
    # simple_names plugin: PgSimplifyInflector-style short names instead of PostGraphile's verbose ones.
    simple_names:
      # Use the short names (users, user(id:), updateUser, author, posts) instead of PostGraphile's verbose names (allUsers, userById, updateUserById, userByAuthorId, postsByAuthorId).
      enabled: false
    # advanced_filters plugin: relation filters, relational ordering and computed-column filtering and ordering.
    advanced_filters:
      # Relation filters (forward, reverse some/none/every and the <rel>Exists/<rel>Exist variants).
      relations: true
      # Filtering and ordering by computed columns (single row-argument stable functions; needs schema.functions). Computed filters are not index-backed, so they bypass filters.indexed_only.
      computed: true
      # One-level relational orderBy values (REL__COLUMN_ASC/_DESC); off as well when relations is off.
      relation_order: true
      # Only foreign keys tagged @filterable (alias @sortable) get relation filters and orderings.
      relations_opt_in: false
      # Only computed-column functions tagged @filterable (alias @sortable) get filter and orderBy surface.
      computed_opt_in: false
    # postgis plugin: spatial filters, accessors, projection arguments and distance ordering.
    postgis:
      # GeometryFilterOps on spatial columns and RasterFilterOps on raster columns.
      filters: true
      # Derived accessors (<field>Area, <field>Centroid, ...) and the raster accessors, pixel value and statistics.
      derived: true
      # Distance ordering (<COLUMN>_DISTANCE_ASC/_DESC), the <field>Distance fields and the near: argument.
      ordering: true
      # The transform:, simplify:, precision: and buffer: projection arguments of spatial column fields.
      projection: true
      # Type spatial column fields as @graphile/postgis-style geometry objects instead of the GeoJSON scalar.
      typed_geometry: false
    # contrib plugin: full-text, pg_trgm, hstore, ltree, range, inet, pgvector, cube and earthdistance surfaces.
    contrib:
      # Vocabulary operators, StringTrgmFilterOps, the unaccent, fuzzystrmatch and intarray inputs, the distance-threshold inputs, the value filters (<field>Nlevel, <field>Value, <field>Icount) and the <field>Rank fields (and so rank ordering).
      filters: true
      # Rank, similarity, Levenshtein, nlevel, icount, value, vector, cube and earth distance orderBy values, the similarity and distance fields and the similarTo:, nearVector:, nearPoint: and hstoreKey: arguments.
      ordering: true
    # nested_mutations plugin: nested connect/create/update/delete/disconnect inputs on create and update mutations.
    nested_mutations:
      # Maximum nesting depth of nested mutation inputs per root field.
      max_depth: 3
      # Maximum nested operations (each list item counting once) per root field.
      max_operations: 50

log:
  # Log level: debug, info, warn, error.
  level: "info"
  # Log format: text or json.
  format: "text"

metrics:
  # Serve Prometheus metrics (HTTP requests, database operations, pool statistics, schema rebuilds).
  enabled: false
  # URL path of the metrics endpoint.
  path: "/metrics"
  # Separate listen address for the metrics endpoint, e.g. :9090, keeping it off the public listener; empty serves it on the main server address.
  addr: ""

# Schema contracts: named GraphQL schemas for different audiences, each a subset of the full schema selected by @contract / @behavior ±contract:<name> smart comments and served at <path>/graphql. Entries are {name, default: include|exclude, path (default /<name>)}, or bare names. When set, only the contracts are served (give one path: / to serve it at /graphql). Requires the smart_comments plugin.
contracts: []
